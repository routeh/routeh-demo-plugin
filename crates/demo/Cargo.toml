[package]
name = "demo"
version = "0.1.0"
description = "The demo plugin's service for the routeh router"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
routeh-plugin-sdk.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rtnetlink for the tunnels' devices, marks on their outer sockets.
socket2 = { version = "0.6", features = ["all"] }

[dev-dependencies]
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
